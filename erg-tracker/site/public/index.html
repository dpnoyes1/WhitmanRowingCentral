<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Whitman Rowing</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#74b0da">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Whitman">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/"><img src="/logo.png" alt="" height="36">Whitman Rowing</a>
    <nav id="nav" hidden>
      <a href="#/team" data-nav="team">Team</a>
      <a href="#/week" data-nav="week">Week</a>
      <a href="#/boards" data-nav="boards">Boards</a>
      <a href="#/stars" data-nav="stars" id="nav-stars" hidden>Stars</a>
      <a href="#/insights" data-nav="insights" id="nav-insights" hidden>Insights</a>
      <a href="#/balance" data-nav="balance" id="nav-balance" hidden>Balance</a>
      <a href="#/oyo" data-nav="oyo">OYO</a>
      <a href="#/athletes" data-nav="athletes">Athletes</a>
      <a href="#/settings" data-nav="settings" id="nav-settings" hidden>Settings</a>
      <a href="#/me" data-nav="me" id="nav-me">Me</a>
      <a href="/logworkout" target="_blank" rel="noopener" class="nav-log">Log a workout ↗</a>
    </nav>
    <a id="log-top" class="log-top" href="/logworkout" target="_blank" rel="noopener" hidden>Log</a>
    <button id="menu" class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="nav" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button id="theme" class="theme-toggle" type="button" aria-label="Switch to dark mode"></button>
  </header>
  <main id="app" aria-live="polite"><p class="muted">Loading…</p></main>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
