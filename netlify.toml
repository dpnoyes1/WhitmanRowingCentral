# Netlify site: whitmanrowingcentral.netlify.app (erg tracker team site).
# No build step: static pages plus functions. Secrets are environment
# variables set in the Netlify UI (see erg-tracker/site/README.md).
[build]
  publish = "erg-tracker/site/public"
  functions = "erg-tracker/site/functions"
  command = "node erg-tracker/tests/run.js && node erg-tracker/site/tests/run.mjs"
  # Save deploy credits (David, 2026-10-23). Exit 0 = skip the build:
  # - no deploy previews: PRs are tested locally and only merges build;
  # - production only when something the site serves changed (not Apps Script or docs only).
  ignore = "if [ \"$CONTEXT\" = deploy-preview ]; then exit 0; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- erg-tracker/site/ netlify.toml package.json package-lock.json"

[functions]
  node_bundler = "esbuild"
  # sharp is a native module (the kept erg photos); it stays outside the esbuild bundle.
  external_node_modules = ["sharp"]

# Short links athletes can type or bookmark (David, 2026-10-23). 302 so the
# targets can change without browsers holding on to the old ones.
[[redirects]]
  from = "/logworkout"
  to = "https://forms.gle/MdNMVFqvVag8u9ux7"
  status = 302
  force = true

[[redirects]]
  from = "/guide"
  to = "https://docs.google.com/document/d/17Y0bhSPgsRpcMfYw4ZONJMwEsy_Kad972T73D5LKG10/edit"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
